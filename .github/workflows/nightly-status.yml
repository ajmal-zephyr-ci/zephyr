name: Nightly Board Test Results

# Jenkins runs the nightly parent pipeline on its own timer (about 01:00 IST).
# Every morning this workflow reads the result (read-only, no token), lists each
# board's pass rate, and fails if any board failed or the nightly did not run.
# Optional: attach the board reports as a downloadable artifact (see the warning
# at NIGHTLY_UPLOAD_ARTIFACTS).

on:
  schedule:
    - cron: '30 0 * * *'     # 00:30 UTC = 06:00 IST, every day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Fetch nightly results from Jenkins
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 15
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      NIGHTLY_JOBS: ${{ vars.JENKINS_TEST_JOB || 'zephyr-test' }}
      MAX_AGE_HOURS: ${{ vars.NIGHTLY_MAX_AGE_HOURS || '26' }}
      # WARNING: this repository is public. Artifacts of a public repository can be
      # downloaded by anyone signed in to GitHub. Robot reports contain internal test
      # names and logs. Keep this 'false' unless that has been approved.
      UPLOAD_ARTIFACTS: ${{ vars.NIGHTLY_UPLOAD_ARTIFACTS || 'false' }}
    steps:
      - name: Read nightly results from Jenkins
        id: read
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          rm -rf nightly-reports && mkdir -p nightly-reports
          FAILED=0
          echo "### Nightly board tests" >> "$GITHUB_STEP_SUMMARY"
          for job in $NIGHTLY_JOBS; do
            # zephyr-test runs both PRs and the nightly: take its newest finished
            # build whose description starts with "nightly ".
            B=$(curl -sf "${JENKINS_URL%/}/job/$job/api/json?tree=builds%5Bnumber,result,building,timestamp,url,description%5D%7B0,60%7D" \
              | jq -c '[.builds[] | select(.building == false and ((.description // "") | startswith("nightly ")))] | first // {}' || echo '{}')
            RESULT=$(echo "$B" | jq -r '.result // "NONE"')
            URL=$(echo "$B" | jq -r '.url // ""')
            AGE_H=$(( ( $(date +%s) - $(echo "$B" | jq -r '(.timestamp // 0) / 1000 | floor') ) / 3600 ))
            STATE="$RESULT"
            [[ "$RESULT" == "SUCCESS" ]] || FAILED=1
            if (( AGE_H > MAX_AGE_HOURS )); then STATE="$RESULT (STALE: ${AGE_H}h old)"; FAILED=1; fi
            echo "$job: $STATE"
            echo "- **$job: $STATE**" >> "$GITHUB_STEP_SUMMARY"

            LINES=""
            [[ -n "$URL" ]] && LINES=$(curl -sf "${URL}consoleText" | grep -o 'BOARD_RESULT: .*' || true)
            if [[ -z "$LINES" && -n "$URL" ]]; then LINES=$(curl -sf "${URL}consoleText" | grep -m1 '^RESULT:' || true); fi
            echo "${LINES:-  (no result lines)}"
            { echo '```'; echo "${LINES:-}" | sed 's# job=[^ ]* build=[0-9]*##'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

            # Optional: fetch each board job's archived reports (job=... build=... in the line)
            if [[ "$UPLOAD_ARTIFACTS" == "true" ]]; then
              while read -r L; do
                BOARD=$(echo "$L" | awk '{print $2}')
                BJOB=$(echo "$L" | sed -n 's#.* job=\([^ ]*\) .*#\1#p')
                BNUM=$(echo "$L" | sed -n 's#.* build=\([0-9]*\).*#\1#p')
                [[ -n "$BJOB" && -n "$BNUM" ]] || continue
                if curl -sf -o "nightly-reports/$BOARD.zip" "${JENKINS_URL%/}/job/$BJOB/$BNUM/artifact/*zip*/archive.zip"; then
                  echo "Fetched reports for $BOARD ($BJOB #$BNUM)"
                else
                  echo "No archived reports for $BOARD ($BJOB #$BNUM)"; rm -f "nightly-reports/$BOARD.zip"
                fi
              done <<< "$(echo "$LINES" | grep 'job=' || true)"
            fi
          done
          echo "reports_dir=$RUNNER_TEMP/nightly-reports" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Upload board reports as an artifact
        if: env.UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-board-reports
          path: ${{ steps.read.outputs.reports_dir }}
          retention-days: 14
          if-no-files-found: warn

      - name: Fail if any board failed
        if: steps.read.outputs.failed == '1'
        shell: bash
        run: |
          echo "One or more nightly board tests failed or did not run. See the run summary."
          exit 1
