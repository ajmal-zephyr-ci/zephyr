name: PR Board Test

# PR opened/updated -> runner tells Jenkins (no token) -> Jenkins runs the board
# tests and decides pass/fail with its own PASS_THRESHOLD -> this check waits
# for that Jenkins build (read-only, no token) and passes or fails with it.

on:
  pull_request_target:
    branches:
      - v4.4.0-ti-next
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: jenkins-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR eligibility check
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_JOB: ${{ vars.JENKINS_TEST_JOB || 'zephyr-test' }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_ROLE: ${{ github.event.pull_request.author_association }}
      PR_BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Read allowed authors and target branch from the Jenkins job
        id: check
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          # Single source of truth: the Jenkins job's parameter defaults
          # (ALLOWED_PR_AUTHORS, PR_TARGET_BRANCH), read without a token.
          PARAMS=$(curl -sf "${JENKINS_URL%/}/job/${JENKINS_JOB}/api/json?tree=property%5BparameterDefinitions%5Bname,defaultParameterValue%5Bvalue%5D%5D%5D") \
            || { echo "ERROR: cannot read Jenkins job $JENKINS_JOB"; exit 1; }
          param() { echo "$PARAMS" | jq -r --arg n "$1" '[.property[]?.parameterDefinitions[]? | select(.name == $n) | .defaultParameterValue.value][0] // empty'; }
          ALLOWED_USERS=$(param ALLOWED_PR_AUTHORS)
          TARGET=$(param PR_TARGET_BRANCH)
          TARGET="${TARGET:-v4.4.0-ti-next}"
          echo "PR author: $PR_AUTHOR ($PR_ROLE), into: $PR_BASE"
          echo "Jenkins settings: target=$TARGET allowed authors='${ALLOWED_USERS}'"

          ALLOWED=false; REASON=""
          if [[ "$PR_BASE" != "$TARGET" ]]; then
            REASON="PR targets $PR_BASE, Jenkins job tests $TARGET"
          elif [[ "$PR_ROLE" == "OWNER" || "$PR_ROLE" == "MEMBER" ]]; then
            ALLOWED=true
          else
            for u in $ALLOWED_USERS; do [[ "$u" == "$PR_AUTHOR" ]] && ALLOWED=true; done
            [[ "$ALLOWED" == true ]] || REASON="author $PR_AUTHOR ($PR_ROLE) is not in ALLOWED_PR_AUTHORS"
          fi

          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          if [[ "$ALLOWED" == true ]]; then
            echo "Allowed - board tests will run"
            echo "### PR allowed - board tests will run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT allowed - board tests skipped: $REASON"
            echo "### Board tests skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"
          fi

  board-test:
    name: Board tests on hardware (Jenkins)
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 360
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_JOB: ${{ vars.JENKINS_TEST_JOB || 'zephyr-test' }}
      REPO: ${{ github.repository }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Notify Jenkins and wait for the result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          # notify_jenkins: tell Jenkins the repo changed (open endpoint, no token).
          # Jenkins re-checks the repo once and builds only if it finds a new commit.
          # GitHub needs a few seconds to recompute a PR's merge preview, so the first
          # notification can arrive too early; the wait loop repeats it until a build
          # appears.
          notify_jenkins() {
            local payload code
            payload=$(jq -n --arg u "https://github.com/$REPO" \
              '{repository:{url:$u,html_url:$u,clone_url:($u+".git")},pusher:{name:"github-actions"}}')
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${JENKINS_URL%/}/github-webhook/" \
              -H "Content-Type: application/json" -H "X-GitHub-Event: push" --data "$payload")
            echo "Jenkins notified: HTTP $code"
            [[ "$code" == "200" ]]
          }

          # start_jenkins <param=value>...: start the Jenkins job directly, so Jenkins
          # never has to work out what changed (no polling, no missed notifications).
          # Needs Jenkins "Anonymous: Job/Build" permission; if that is not granted it
          # falls back to the /github-webhook/ notification, which asks Jenkins to look
          # for new commits itself.
          DIRECT_START=no
          KEY_PARAM="PR_NUMBER=$PR_NUMBER"
          # already_running <key>: true if Jenkins is already queued or building this
          # PR (or this promotion). Checked before every start request, so a retry, a
          # second workflow run, or a leftover run can never queue the same work twice.
          already_running() {
            local key="$1" q b
            q=$(curl -sf "${JENKINS_URL%/}/queue/api/json?tree=items%5Btask%5Bname%5D,params%5D" \
              | jq -r --arg j "$JENKINS_JOB" --arg k "$KEY_PARAM" \
                '[.items[]? | select(.task.name == $j) | .params // ""] | join(" ")' 2>/dev/null || true)
            if [[ -n "$KEY_PARAM" && "$q" == *"$KEY_PARAM"* ]]; then
              echo "Jenkins already has this queued; not asking again"; return 0
            fi
            [[ -z "$KEY_PARAM" && -n "$q" ]] && { echo "Jenkins already has this queued; not asking again"; return 0; }
            b=$(curl -sf "${JENKINS_URL%/}/job/${JENKINS_JOB}/api/json?tree=builds%5Bbuilding,description%5D%7B0,10%7D" \
              | jq -r --arg k "$key" '[.builds[]? | select(.building == true and ((.description // "") | startswith($k)))] | length' 2>/dev/null || echo 0)
            if [[ "${b:-0}" != "0" ]]; then
              echo "Jenkins is already building this; not asking again"; return 0
            fi
            return 1
          }

          start_jenkins() {
            local q="" json crumb field code jar
            if already_running "pr PR#$PR_NUMBER"; then DIRECT_START=yes; return 0; fi
            for kv in "$@"; do q="$q&$kv"; done
            # Jenkins ties the CSRF crumb to the session, so the crumb request and
            # the POST must share cookies: hence the cookie jar.
            jar=$(mktemp)
            json=$(curl -sf -c "$jar" "${JENKINS_URL%/}/crumbIssuer/api/json" || true)
            field=$(echo "$json" | jq -r '.crumbRequestField // empty' 2>/dev/null || true)
            crumb=$(echo "$json" | jq -r '.crumb // empty' 2>/dev/null || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -b "$jar" -c "$jar" \
              ${field:+-H "$field: $crumb"} \
              "${JENKINS_URL%/}/job/${JENKINS_JOB}/buildWithParameters?${q#&}")
            rm -f "$jar"
            if [[ "$code" == "201" || "$code" == "200" || "$code" == "302" ]]; then
              echo "Jenkins build requested: HTTP $code"
              DIRECT_START=yes   # the build is queued: never ask again, or it runs twice
              return 0
            fi
            echo "Could not start the job directly (HTTP $code); falling back to a notification"
            DIRECT_START=no      # Jenkins may find nothing to do, so the wait loop retries
            notify_jenkins
          }

          # wait_for_jenkins <job> <key> <max-minutes> <mode>
          # zephyr-test runs PRs and the nightly, so a build is matched by its
          # description "<mode> <key>". For a PR the key is "PR#<number>", because
          # Jenkins tests the PR's merge preview, whose commit id differs from the
          # PR head commit GitHub knows.
          # Finds the Jenkins build that tested <commit-sha>, waits for it to finish,
          # prints its pass-rate line, and returns 0 for SUCCESS, 1 otherwise.
          # Uses only anonymous read access to Jenkins (no token).
          wait_for_jenkins() {
            local job="$1" sha="$2" max_min="$3" mode="$4" api build result url line tries=0
            api="${JENKINS_URL%/}/job/${job}/api/json?tree=builds%5Bnumber,result,building,url,description%5D%7B0,60%7D"
            for _ in $(seq 1 $((max_min * 2))); do
              build=$(curl -sf "$api" | jq -c --arg s "$sha" --arg m "$mode" \
                '[.builds[] | select((.description // "") | startswith($m + " " + $s))] | first // empty') || build=""
              if [[ -n "$build" ]]; then
                url=$(echo "$build" | jq -r .url)
                if [[ "$(echo "$build" | jq -r .building)" == "false" ]]; then
                  result=$(echo "$build" | jq -r .result)
                  # Parent pipeline prints one BOARD_RESULT line per board; a single
                  # board job prints a RESULT line. Show whichever the build has.
                  line=$(curl -sf "${url}consoleText" | grep -o 'BOARD_RESULT: .*' || true)
                  [[ -n "$line" ]] || line=$(curl -sf "${url}consoleText" | grep -m1 '^RESULT:' || true)
                  echo "Jenkins build: $url"
                  echo "Jenkins result: $result"
                  echo "${line:-RESULT: (no result lines in log)}"
                  { echo "### Jenkins $job: $result"; echo '```'; echo "${line:-}" | sed 's# job=[^ ]* build=[0-9]*##'; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  [[ "$result" == "SUCCESS" ]]
                  return
                fi
                echo "Jenkins build running: $url"
              else
                echo "Waiting for Jenkins to start a build of $job for ${sha:0:12}..."
                tries=$((tries + 1))
                # Only the notification path can silently do nothing, so only that one
                # is repeated (every 5 minutes). After a successful direct start the
                # build is already queued, and asking again would run it twice.
                if [[ "$DIRECT_START" != "yes" ]] && (( tries % 10 == 0 )); then start_jenkins "MODE=pr" "PR_NUMBER=$PR_NUMBER" || true; fi
              fi
              sleep 30
            done
            echo "ERROR: no finished Jenkins build of $job for ${sha:0:12} within $max_min minutes"
            return 1
          }

          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: invalid commit"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "ERROR: invalid PR number"; exit 1; }

          # 1. Ask Jenkins to test this PR
          start_jenkins "MODE=pr" "PR_NUMBER=$PR_NUMBER" \
            || { echo "ERROR: could not reach Jenkins"; exit 1; }

          # 2. Wait for the Jenkins build of this PR; pass/fail with it
          echo "PR #$PR_NUMBER, head commit ${PR_SHA:0:12}"
          sleep 20   # let the queued build appear and set its description
          wait_for_jenkins "$JENKINS_JOB" "PR#$PR_NUMBER" 330 pr
