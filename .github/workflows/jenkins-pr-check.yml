name: PR Board Test

# PR opened/updated -> runner tells Jenkins (no token) -> Jenkins runs the board
# tests and decides pass/fail with its own PASS_THRESHOLD -> this check waits
# for that Jenkins build (read-only, no token) and passes or fails with it.

on:
  pull_request_target:
    branches:
      - v4.4.0-ti-next
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: jenkins-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: PR eligibility check
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 5
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_JOB: ${{ vars.JENKINS_TEST_JOB || 'zephyr-test' }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_ROLE: ${{ github.event.pull_request.author_association }}
      PR_BASE: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Read allowed authors and target branch from the Jenkins job
        id: check
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          # Single source of truth: the Jenkins job's parameter defaults
          # (ALLOWED_PR_AUTHORS, PR_TARGET_BRANCH), read without a token.
          PARAMS=$(curl -sf "${JENKINS_URL%/}/job/${JENKINS_JOB}/api/json?tree=property%5BparameterDefinitions%5Bname,defaultParameterValue%5Bvalue%5D%5D%5D") \
            || { echo "ERROR: cannot read Jenkins job $JENKINS_JOB"; exit 1; }
          param() { echo "$PARAMS" | jq -r --arg n "$1" '[.property[]?.parameterDefinitions[]? | select(.name == $n) | .defaultParameterValue.value][0] // empty'; }
          ALLOWED_USERS=$(param ALLOWED_PR_AUTHORS)
          TARGET=$(param PR_TARGET_BRANCH)
          TARGET="${TARGET:-v4.4.0-ti-next}"
          echo "PR author: $PR_AUTHOR ($PR_ROLE), into: $PR_BASE"
          echo "Jenkins settings: target=$TARGET allowed authors='${ALLOWED_USERS}'"

          ALLOWED=false; REASON=""
          if [[ "$PR_BASE" != "$TARGET" ]]; then
            REASON="PR targets $PR_BASE, Jenkins job tests $TARGET"
          elif [[ "$PR_ROLE" == "OWNER" || "$PR_ROLE" == "MEMBER" ]]; then
            ALLOWED=true
          else
            for u in $ALLOWED_USERS; do [[ "$u" == "$PR_AUTHOR" ]] && ALLOWED=true; done
            [[ "$ALLOWED" == true ]] || REASON="author $PR_AUTHOR ($PR_ROLE) is not in ALLOWED_PR_AUTHORS"
          fi

          echo "allowed=$ALLOWED" >> "$GITHUB_OUTPUT"
          if [[ "$ALLOWED" == true ]]; then
            echo "Allowed - board tests will run"
            echo "### PR allowed - board tests will run" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "NOT allowed - board tests skipped: $REASON"
            echo "### Board tests skipped: $REASON" >> "$GITHUB_STEP_SUMMARY"
          fi

  board-test:
    name: Board tests on hardware (Jenkins)
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 360
    env:
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_JOB: ${{ vars.JENKINS_TEST_JOB || 'zephyr-test' }}
      REPO: ${{ github.repository }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Notify Jenkins and wait for the result
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          # wait_for_jenkins <job> <commit-sha> <max-minutes> <mode>
          # The parent job handles PR, nightly and promotion, so a build is matched by
          # its description "<mode> <commit>" (set by the parent), not by any checkout.
          # Finds the Jenkins build that tested <commit-sha>, waits for it to finish,
          # prints its pass-rate line, and returns 0 for SUCCESS, 1 otherwise.
          # Uses only anonymous read access to Jenkins (no token).
          wait_for_jenkins() {
            local job="$1" sha="$2" max_min="$3" mode="$4" api build result url line
            api="${JENKINS_URL%/}/job/${job}/api/json?tree=builds%5Bnumber,result,building,url,description%5D%7B0,60%7D"
            for _ in $(seq 1 $((max_min * 2))); do
              build=$(curl -sf "$api" | jq -c --arg s "$sha" --arg m "$mode" \
                '[.builds[] | select((.description // "") | startswith($m + " " + $s))] | first // empty') || build=""
              if [[ -n "$build" ]]; then
                url=$(echo "$build" | jq -r .url)
                if [[ "$(echo "$build" | jq -r .building)" == "false" ]]; then
                  result=$(echo "$build" | jq -r .result)
                  # Parent pipeline prints one BOARD_RESULT line per board; a single
                  # board job prints a RESULT line. Show whichever the build has.
                  line=$(curl -sf "${url}consoleText" | grep -o 'BOARD_RESULT: .*' || true)
                  [[ -n "$line" ]] || line=$(curl -sf "${url}consoleText" | grep -m1 '^RESULT:' || true)
                  echo "Jenkins build: $url"
                  echo "Jenkins result: $result"
                  echo "${line:-RESULT: (no result lines in log)}"
                  { echo "### Jenkins $job: $result"; echo '```'; echo "${line:-}" | sed 's# job=[^ ]* build=[0-9]*##'; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  [[ "$result" == "SUCCESS" ]]
                  return
                fi
                echo "Jenkins build running: $url"
              else
                echo "Waiting for Jenkins to start a build of $job for commit ${sha:0:12}..."
              fi
              sleep 30
            done
            echo "ERROR: no finished Jenkins build of $job for ${sha:0:12} within $max_min minutes"
            return 1
          }

          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          [[ "$PR_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR: invalid commit"; exit 1; }

          # 1. Tell Jenkins the repo changed (open endpoint, no token)
          REPO_URL="https://github.com/$REPO"
          PAYLOAD=$(jq -n --arg u "$REPO_URL" '{repository:{url:$u,html_url:$u,clone_url:($u+".git")},pusher:{name:"github-actions"}}')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${JENKINS_URL%/}/github-webhook/" \
            -H "Content-Type: application/json" -H "X-GitHub-Event: push" --data "$PAYLOAD")
          echo "Jenkins notified: HTTP $CODE"
          [[ "$CODE" == "200" ]] || { echo "ERROR: Jenkins did not accept the notification"; exit 1; }

          # 2. Wait for the Jenkins build of this exact PR commit; pass/fail with it
          wait_for_jenkins "$JENKINS_JOB" "$PR_SHA" 330 pr
