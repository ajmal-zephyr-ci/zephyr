name: Trigger Jenkins

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to test'
        required: true
        default: 'ci-trigger'
        type: string

  pull_request_target:
    branches:
      - v4.4.0-ti-next
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  trigger-jenkins:
    name: Trigger Jenkins Pipeline

    # Manual runs, or PRs from branches inside this same repo only (never forks)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 15

    steps:
      - name: Trigger Jenkins and wait for the build to start
        shell: bash
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB: ${{ secrets.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          ZEPHYR_REPO: "https://github.com/${{ github.repository }}.git"
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          for tool in curl jq; do
            command -v "$tool" >/dev/null || { echo "ERROR: $tool is not installed"; exit 1; }
          done
          for var in JENKINS_URL JENKINS_JOB JENKINS_USER JENKINS_TOKEN; do
            [[ -n "${!var}" ]] || { echo "ERROR: secret $var is not set"; exit 1; }
          done

          # ---- What to build ----
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]          || { echo "ERROR: invalid PR number"; exit 1; }
            [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]  || { echo "ERROR: invalid PR head SHA"; exit 1; }
            BRANCH="$PR_HEAD_BRANCH"
          else
            BRANCH="${MANUAL_BRANCH:-ci-trigger}"
            PR_NUMBER=""
            PR_HEAD_SHA=""
          fi
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "ERROR: invalid branch name"; exit 1; }

          echo "Event:    $EVENT_NAME"
          echo "Repo:     $ZEPHYR_REPO"
          echo "Branch:   $BRANCH"
          echo "PR:       ${PR_NUMBER:-none}  SHA: ${PR_HEAD_SHA:-none}"
          echo "Job:      $JENKINS_JOB"

          AUTH="$JENKINS_USER:$JENKINS_TOKEN"
          JOB_URL="${JENKINS_URL%/}/job/$JENKINS_JOB"

          # ---- Check Jenkins is reachable ----
          curl --fail --silent --show-error --user "$AUTH" --output /dev/null "$JOB_URL/api/json"
          echo "Jenkins job is reachable"

          # ---- Request the build; Jenkins answers with a queue item URL ----
          HEADERS=$(mktemp); trap 'rm -f "$HEADERS"' EXIT
          curl --fail --silent --show-error --user "$AUTH" \
            --dump-header "$HEADERS" --output /dev/null --request POST \
            --data-urlencode "ZEPHYR_REPO=$ZEPHYR_REPO" \
            --data-urlencode "GIT_BRANCH=$BRANCH" \
            --data-urlencode "PR_NUMBER=$PR_NUMBER" \
            --data-urlencode "PR_HEAD_SHA=$PR_HEAD_SHA" \
            "$JOB_URL/buildWithParameters"

          QUEUE_URL=$(grep -i '^location:' "$HEADERS" | awk '{print $2}' | tr -d '\r')
          [[ -n "$QUEUE_URL" ]] || { echo "ERROR: Jenkins did not return a queue item"; exit 1; }
          echo "Queued: $QUEUE_URL"

          # ---- Follow the queue item until the build starts (max ~10 minutes) ----
          for _ in $(seq 1 60); do
            ITEM=$(curl --fail --silent --show-error --user "$AUTH" "${QUEUE_URL%/}/api/json")
            BUILD_URL=$(echo "$ITEM" | jq -r '.executable.url // empty')
            if [[ -n "$BUILD_URL" ]]; then
              BUILD_NO=$(echo "$ITEM" | jq -r '.executable.number')
              echo "Jenkins build started: $BUILD_URL"
              echo "### Jenkins build #$BUILD_NO started" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$(echo "$ITEM" | jq -r '.cancelled // false')" == "true" ]]; then
              echo "ERROR: the Jenkins queue item was cancelled"; exit 1
            fi
            echo "Waiting in Jenkins queue: $(echo "$ITEM" | jq -r '.why // "..."')"
            sleep 10
          done
          echo "ERROR: build did not start within 10 minutes"; exit 1
