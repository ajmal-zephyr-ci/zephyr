name: Weekly Promotion (next to main)

# Every Monday: open (or reuse) a PR next -> main, point a candidate branch at
# next, tell Jenkins (no token), wait for the promotion job's result (Jenkins
# applies PASS_THRESHOLD), and merge the PR only if Jenkins passed.
# Uses only the built-in GITHUB_TOKEN that GitHub gives every workflow run.

on:
  schedule:
    - cron: '30 20 * * 0'    # Monday 02:00 IST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: weekly-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Test on hardware and merge next into main
    runs-on: [self-hosted, linux, x64, jenkins-internal]
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      JENKINS_URL: ${{ secrets.JENKINS_URL }}
      JENKINS_JOB: ${{ vars.JENKINS_PROMOTION_JOB || 'zephyr-promotion' }}
      NEXT_BRANCH: ${{ vars.NEXT_BRANCH || 'v4.4.0-ti-next' }}
      MAIN_BRANCH: ${{ vars.MAIN_BRANCH || 'v4.4.0-ti' }}
      CANDIDATE: promotion/candidate
      REPO: ${{ github.repository }}
      NOTIFY_USERS: ${{ vars.PROMOTION_NOTIFY_USERS || '' }}
      NOTIFY_COMMIT_AUTHORS: ${{ vars.NOTIFY_COMMIT_AUTHORS || 'true' }}
      APP_ID: ${{ secrets.PROMOTION_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
      REQUIRE_PR_CHECKS: ${{ vars.REQUIRE_PR_CHECKS || 'true' }}
      PR_CHECKS_TIMEOUT_MIN: ${{ vars.PR_CHECKS_TIMEOUT_MIN || '120' }}
      SELF_JOB: Test on hardware and merge next into main
    steps:
      - name: Prepare, test, and merge
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # clean folder: no leftover git checkout here
          # wait_for_jenkins <job> <commit-sha> <max-minutes> <mode>
          # The parent job handles PR, nightly and promotion, so a build is matched by
          # its description "<mode> <commit>" (set by the parent), not by any checkout.
          # Finds the Jenkins build that tested <commit-sha>, waits for it to finish,
          # prints its pass-rate line, and returns 0 for SUCCESS, 1 otherwise.
          # Uses only anonymous read access to Jenkins (no token).
          wait_for_jenkins() {
            local job="$1" sha="$2" max_min="$3" mode="$4" api build result url line tries=0
            api="${JENKINS_URL%/}/job/${job}/api/json?tree=builds%5Bnumber,result,building,url,description%5D%7B0,60%7D"
            for _ in $(seq 1 $((max_min * 2))); do
              build=$(curl -sf "$api" | jq -c --arg s "$sha" --arg m "$mode" \
                '[.builds[] | select((.description // "") | startswith($m + " " + $s))] | first // empty') || build=""
              if [[ -n "$build" ]]; then
                url=$(echo "$build" | jq -r .url)
                if [[ "$(echo "$build" | jq -r .building)" == "false" ]]; then
                  result=$(echo "$build" | jq -r .result)
                  # Parent pipeline prints one BOARD_RESULT line per board; a single
                  # board job prints a RESULT line. Show whichever the build has.
                  line=$(curl -sf "${url}consoleText" | grep -o 'BOARD_RESULT: .*' || true)
                  [[ -n "$line" ]] || line=$(curl -sf "${url}consoleText" | grep -m1 '^RESULT:' || true)
                  echo "Jenkins build: $url"
                  echo "Jenkins result: $result"
                  echo "${line:-RESULT: (no result lines in log)}"
                  { echo "### Jenkins $job: $result"; echo '```'; echo "${line:-}" | sed 's# job=[^ ]* build=[0-9]*##'; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                  [[ "$result" == "SUCCESS" ]]
                  return
                fi
                echo "Jenkins build running: $url"
              else
                echo "Waiting for Jenkins to start a build of $job for ${sha:0:12}..."
                tries=$((tries + 1))
                # Re-notify every 2 minutes: the first notification can reach Jenkins
                # before GitHub has published the new commit to test.
                if (( tries % 4 == 0 )); then notify_jenkins || true; fi
              fi
              sleep 30
            done
            echo "ERROR: no finished Jenkins build of $job for ${sha:0:12} within $max_min minutes"
            return 1
          }

          [[ -n "$JENKINS_URL" ]] || { echo "ERROR: secret JENKINS_URL is not set"; exit 1; }
          for tool in gh jq curl openssl; do command -v "$tool" >/dev/null || { echo "ERROR: $tool missing"; exit 1; }; done

          # GitHub App identity ("robot user"). PRs it opens are treated like a normal
          # contributor's, so the repo's PR checks start automatically. Without the
          # app secrets, the built-in workflow key is used (checks then need approval).
          # App keys last 1 hour, so a fresh one is made before each group of API calls.
          use_app_identity() {
            if [[ -z "${APP_ID:-}" || -z "${APP_PRIVATE_KEY:-}" ]]; then
              echo "GitHub App secrets not set - using the built-in workflow key"
              return 0
            fi
            local now hdr pay sig jwt inst tok keyfile
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            keyfile=$(mktemp); printf '%s\n' "$APP_PRIVATE_KEY" > "$keyfile"
            now=$(date +%s)
            hdr=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
            pay=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' $((now - 60)) $((now + 540)) "$APP_ID" | b64url)
            sig=$(printf '%s.%s' "$hdr" "$pay" | openssl dgst -sha256 -sign "$keyfile" | b64url)
            rm -f "$keyfile"
            jwt="$hdr.$pay.$sig"
            inst=$(curl -sf -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/installation" | jq -r '.id // empty') \
              || { echo "ERROR: GitHub App is not installed on $REPO"; exit 1; }
            tok=$(curl -sf -X POST -H "Authorization: Bearer $jwt" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/app/installations/$inst/access_tokens" | jq -r '.token // empty') \
              || { echo "ERROR: could not get a GitHub App key"; exit 1; }
            [[ -n "$tok" ]] || { echo "ERROR: empty GitHub App key"; exit 1; }
            echo "::add-mask::$tok"
            export GH_TOKEN="$tok"
            echo "Using the GitHub App identity"
          }
          use_app_identity

          # Everything below uses only the GitHub web API (gh api): no local git
          # checkout is needed, so leftover or missing folders cannot break it.
          OWNER="${REPO%%/*}"

          # 1. Anything to promote?
          AHEAD=$(gh api "repos/$REPO/compare/$MAIN_BRANCH...$NEXT_BRANCH" -q .ahead_by)
          if [[ "$AHEAD" == "0" ]]; then
            echo "$NEXT_BRANCH has nothing new for $MAIN_BRANCH - nothing to promote"
            echo "### Nothing to promote this week" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SHA=$(gh api "repos/$REPO/branches/$NEXT_BRANCH" -q .commit.sha)
          WEEK=$(date +%G-W%V)
          echo "Promoting $NEXT_BRANCH ($AHEAD commits, ${SHA:0:12}) into $MAIN_BRANCH for $WEEK"

          # 2. Point the candidate branch at next (the promotion Jenkins job watches it)
          if gh api "repos/$REPO/git/ref/heads/$CANDIDATE" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/heads/$CANDIDATE" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$CANDIDATE" -f sha="$SHA" >/dev/null
          fi
          echo "Candidate branch $CANDIDATE -> ${SHA:0:12}"

          # 3. Open the promotion PR (or reuse the open one)
          PR=$(gh api "repos/$REPO/pulls?state=open&base=$MAIN_BRANCH&head=$OWNER:$NEXT_BRANCH" -q '.[0].number // empty')
          if [[ -z "$PR" ]]; then
            PR=$(gh api -X POST "repos/$REPO/pulls" \
              -f title="Weekly promotion $WEEK: $NEXT_BRANCH -> $MAIN_BRANCH" \
              -f head="$NEXT_BRANCH" -f base="$MAIN_BRANCH" \
              -f body="Automatic weekly promotion. Merged only if the Jenkins board tests reach the configured pass threshold. After merging, do NOT delete the source branch ($NEXT_BRANCH)." \
              -q .number)
          fi
          echo "Promotion PR: #$PR"

          # 4. Tell Jenkins (no token), then wait for its verdict on this exact commit
          notify_jenkins || { echo "ERROR: Jenkins did not accept the notification"; exit 1; }

          # notify_jenkins: tell Jenkins the repo changed (open endpoint, no token).
          # Jenkins re-checks the repo once and builds only if it finds a new commit.
          # GitHub needs a few seconds to recompute a PR's merge preview, so the first
          # notification can arrive too early; the wait loop repeats it until a build
          # appears.
          notify_jenkins() {
            local payload code
            payload=$(jq -n --arg u "https://github.com/$REPO" \
              '{repository:{url:$u,html_url:$u,clone_url:($u+".git")},pusher:{name:"github-actions"}}')
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "${JENKINS_URL%/}/github-webhook/" \
              -H "Content-Type: application/json" -H "X-GitHub-Event: push" --data "$payload")
            echo "Jenkins notified: HTTP $code"
            [[ "$code" == "200" ]]
          }

          # Report text for the public PR: no internal addresses, only job, build and result
          report() {
            local job_build result_line jenkins_result
            job_build=$(echo "$1" | sed -n 's#^Jenkins build: .*/job/\([^/]*\)/\([0-9]*\)/.*#\1 build \2#p' | head -1)
            jenkins_result=$(echo "$1" | grep -m1 '^Jenkins result:' || true)
            result_line=$(echo "$1" | grep -E '^(BOARD_RESULT|RESULT):' | sed 's# job=[^ ]* build=[0-9]*##' || true)
            printf 'Jenkins job: %s\n%s\n%s\n' "${job_build:-$JENKINS_JOB}" "$jenkins_result" "$result_line"
          }
          comment() { gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$1" >/dev/null; }

          # Wait for the PR checks (compliance, coding guidelines, ...) on the promoted
          # commit. Prints "CHECK: ..." lines; returns 0 only if all passed (or were skipped).
          wait_for_pr_checks() {
            local start last_auth now runs total pending failed st st_total
            start=$(date +%s); last_auth=$start
            while :; do
              now=$(date +%s)
              if (( now - last_auth > 2400 )); then use_app_identity >&2; last_auth=$now; fi
              runs=$(gh api --paginate "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                -q ".check_runs[] | select(any(.pull_requests[]?; .number == $PR)) | select(.name != \"$SELF_JOB\") | {name, status, conclusion}" \
                | jq -s '.')
              st=$(gh api "repos/$REPO/commits/$SHA/status" -q '.state'); st_total=$(gh api "repos/$REPO/commits/$SHA/status" -q '.total_count')
              total=$(echo "$runs" | jq 'length')
              pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
              failed=$(echo "$runs" | jq -r '.[] | select(.status == "completed" and ((.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral") | not)) | "CHECK: \(.name): \(.conclusion)"')
              if [[ -n "$failed" || ( "$st_total" != "0" && ( "$st" == "failure" || "$st" == "error" ) ) ]]; then
                echo "CHECK: PR checks FAILED"; [[ -n "$failed" ]] && echo "$failed"
                [[ "$st" == "failure" || "$st" == "error" ]] && echo "CHECK: commit status: $st"
                return 1
              fi
              if (( total > 0 && pending == 0 )) && [[ "$st_total" == "0" || "$st" == "success" ]]; then
                echo "CHECK: all $total PR checks passed (or were skipped)"
                return 0
              fi
              if (( total == 0 && now - start > 900 )); then
                echo "CHECK: no PR checks found on PR #$PR after 15 minutes (waiting for approval?)"
                return 1
              fi
              if (( now - start > PR_CHECKS_TIMEOUT_MIN * 60 )); then
                echo "CHECK: PR checks still running after $PR_CHECKS_TIMEOUT_MIN minutes:"
                echo "$runs" | jq -r '.[] | select(.status != "completed") | "CHECK: \(.name): \(.status)"'
                return 1
              fi
              echo "Waiting for PR checks: $pending of $total still running..." >&2
              sleep 30
            done
          }
          # Who to notify on failure: the configured people, plus (optionally) the
          # authors of the commits in this promotion. Bots are left out.
          PEOPLE="$NOTIFY_USERS"
          if [[ "$NOTIFY_COMMIT_AUTHORS" == "true" ]]; then
            PEOPLE="$PEOPLE $(gh api "repos/$REPO/compare/$MAIN_BRANCH...$NEXT_BRANCH" \
              -q '[.commits[].author.login // empty | select(endswith("[bot]") | not)] | unique | .[]' 2>/dev/null | tr '\n' ' ')"
          fi
          MENTIONS=""
          for u in $(echo "$PEOPLE" | tr ' ' '\n' | sed 's/^@//' | sort -u); do MENTIONS="$MENTIONS @$u"; done

          if OUT=$(wait_for_jenkins "$JENKINS_JOB" "$SHA" 330 promotion); then
            echo "$OUT"
            use_app_identity
            CHECKS="CHECK: PR checks not required (REQUIRE_PR_CHECKS=$REQUIRE_PR_CHECKS)"
            if [[ "$REQUIRE_PR_CHECKS" == "true" ]]; then
              echo "Board tests passed. Waiting for the PR checks on PR #$PR..."
              if ! CHECKS=$(wait_for_pr_checks); then
                echo "$CHECKS"
                gh api -X POST "repos/$REPO/labels" -f name=promotion-failed -f color=B60205 \
                  -f description="Weekly promotion blocked by board test results" >/dev/null 2>&1 || true
                gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=promotion-failed" >/dev/null 2>&1 || true
                comment "$(printf '**Weekly promotion %s: NOT merged - board tests passed, but PR checks did not.**%s\n\n```\n%s\n%s\n```\nFix the failing checks on %s; the next promotion run will try again.\n' "$WEEK" "${MENTIONS:+ cc$MENTIONS}" "$(report "$OUT")" "$CHECKS" "$NEXT_BRANCH")"
                echo "### Promotion $WEEK NOT merged: PR checks failed (PR #$PR)" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            echo "$CHECKS"
            comment "$(printf '**Weekly promotion %s: board tests and PR checks passed - merging.**\n\n```\n%s\n%s\n```\n' "$WEEK" "$(report "$OUT")" "$CHECKS")"
            gh api -X DELETE "repos/$REPO/issues/$PR/labels/promotion-failed" >/dev/null 2>&1 || true
            gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=merge \
              -f commit_title="Weekly promotion $WEEK: $NEXT_BRANCH -> $MAIN_BRANCH (#$PR)" >/dev/null
            echo "Merged PR #$PR into $MAIN_BRANCH"
            echo "### Promotion $WEEK merged (PR #$PR)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$OUT"
            use_app_identity
            gh api -X POST "repos/$REPO/labels" -f name=promotion-failed -f color=B60205 \
              -f description="Weekly promotion blocked by board test results" >/dev/null 2>&1 || true
            gh api -X POST "repos/$REPO/issues/$PR/labels" -f "labels[]=promotion-failed" >/dev/null 2>&1 || true
            comment "$(printf '**Weekly promotion %s: NOT merged - board tests below the pass threshold.**%s\n\n```\n%s\n```\nFix the failures on %s; the next promotion run will test again.\n' "$WEEK" "${MENTIONS:+ cc$MENTIONS}" "$(report "$OUT")" "$NEXT_BRANCH")"
            echo "### Promotion $WEEK NOT merged (PR #$PR)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
